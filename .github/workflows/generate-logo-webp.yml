name: Generate WebP logo

on:
  push:
    branches:
      - feature/update-logo
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch donde añadir la WebP (cuando se lance manualmente)'
        required: true
        default: 'main'

permissions:
  contents: write

jobs:
  generate-webp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install webp tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp git

      - name: Determine target branch
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.target_branch }}" >> $GITHUB_OUTPUT
          else
            # Extract branch name from ref (refs/heads/BRANCH)
            BRANCH_REF=${GITHUB_REF#refs/heads/}
            echo "target=${BRANCH_REF}" >> $GITHUB_OUTPUT
          fi

      - name: Convert JPG to WebP if missing or outdated
        run: |
          SRC="assets/img/LogoFinalHorizonte.jpg"
          DST="assets/img/LogoFinalHorizonte.webp"
          TARGET_BRANCH="${{ steps.target.outputs.target }}"

          if [ ! -f "$SRC" ]; then
            echo "Source JPG not found: $SRC"
            exit 1
          fi

          # Convert if dst missing or src is newer
          if [ ! -f "$DST" ] || [ "$SRC" -nt "$DST" ]; then
            cwebp -q 80 "$SRC" -o "$DST"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$DST"
            if git commit -m "Add optimized logo WebP"; then
              # Push to the target branch
              git push origin HEAD:"${TARGET_BRANCH}"
            else
              echo "No changes to commit"
            fi
          else
            echo "WebP already up to date"
          fi
